name: GBFS 校验

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76
        with:
          version: "0.10.18+6c83a7f62"
          core-version: "0.10.18+6c83a7f62"
      - run: moon version --all
      - run: moon update
      - run: moon fmt --check
      - run: moon check --target js --deny-warn
      - run: moon test --target js --deny-warn
      - run: moon build --target js --deny-warn
      - run: node tools/embed-schemas.cjs --check
      - run: node tools/verify-cli.cjs
