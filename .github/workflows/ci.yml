name: GBFS 校验

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 安装固定版本 MoonBit
        env:
          MOON_HOME: ${{ runner.temp }}/gbfs-moon
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/moonbit-install.sh"
          bash "$RUNNER_TEMP/moonbit-install.sh" '0.10.18+6c83a7f62'
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
      - run: moon version --all
      - run: moon update
      - run: moon fmt --check
      - run: moon check --target js --deny-warn
      - run: moon test --target js --deny-warn
      - run: moon build --target js --deny-warn
      - run: node tools/embed-schemas.cjs --check
      - run: node tools/verify-cli.cjs
      - run: node tools/verify-mutations.cjs
      - run: npm ci --prefix tools/schema-reference --ignore-scripts --no-audit --no-fund
      - name: 对照官方 Schema
        run: |
          node tools/schema-reference/compare.cjs > _build/schema-comparison.json
          node -e 'const r=require("./_build/schema-comparison.json"); console.log(JSON.stringify({total:r.total,agreements:r.agreements,differences:r.differences,unexpected:r.unexpected}))'
